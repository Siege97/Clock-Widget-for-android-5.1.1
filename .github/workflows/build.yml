              <string name="app_name">Relógio Widget</string>
              <string name="widget_name">Relógio digital</string>
              <string name="escolha_app">Abrir ao tocar:</string>
              <string name="escolher_app">Escolher app…</string>

              <string name="rotulo_toque">Ao tocar no relógio:</string>
              <string name="toque_app">Abrir um app</string>
              <string name="toque_nada">Não fazer nada</string>
              <string name="toque_tela">Manter a tela ligada (liga e desliga a cada toque)</string>
              <string name="explicacao_tela">Com a tela ligada, aparece um ícone de cadeado na barra de status e a tela não apaga sozinha. Toque no relógio de novo, ou na notificação, para desligar.</string>
              <string name="rotulo_app">App que será aberto:</string>

              <string name="rotulo_posicao">Posição do relógio (em pixels)</string>
              <string name="explicacao_posicao">Positivo move para a direita (horizontal) ou para baixo (vertical). Negativo move para a esquerda ou para cima. Use 0 para centralizar.</string>
