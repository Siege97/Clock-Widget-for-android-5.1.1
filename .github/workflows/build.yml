name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Criar os arquivos do projeto
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.exemplo.relogiowidget'
              compileSdk 34

              // Chave de assinatura fixa: assim cada APK novo instala por cima do anterior
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'chave'
                      keyPassword 'android'
                  }
              }

              defaultConfig {
                  applicationId "com.exemplo.relogiowidget"
                  minSdk 22          // Android 5.1.1
                  targetSdk 34
                  versionCode 8
                  versionName "4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Manter a tela ligada: trava de tela + serviço em primeiro plano (com ícone na barra de status) -->
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <!-- Permite listar os apps instalados na tela de escolha (Android 11+) -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name">

                  <!-- Ícone do app: escolher o app do toque e ajustar a posição -->
                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:theme="@android:style/Theme.DeviceDefault.Light">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Lista de apps: aparece ao adicionar o widget, ao tocar sem app escolhido e nos ajustes -->
                  <activity
                      android:name=".ConfigActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.Light.Dialog">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAwakeService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="manter_tela_ligada" />
                  </service>

                  <receiver
                      android:name=".ClockWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/clock_widget_info" />
                  </receiver>

              </application>

          </manifest>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/ClockOptions.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/ClockOptions.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.graphics.Typeface;

          /** Opções de aparência do relógio: fontes, rotações, cores e opacidade. */
          final class ClockOptions {

              private ClockOptions() {
              }

              // Fontes do sistema. A chave entra no nome do layout (widget_clock_<chave>_<rotação>)
              static final String[] FONT_KEYS = {
                      "normal", "light", "thin", "medium", "black",
                      "condensed", "serif", "mono", "casual", "cursive"
              };
              static final String[] FONT_FAMILIES = {
                      "sans-serif", "sans-serif-light", "sans-serif-thin", "sans-serif-medium", "sans-serif-black",
                      "sans-serif-condensed", "serif", "monospace", "casual", "cursive"
              };
              static final int[] FONT_LABELS = {
                      R.string.fonte_normal, R.string.fonte_leve, R.string.fonte_fina, R.string.fonte_media,
                      R.string.fonte_preta, R.string.fonte_condensada, R.string.fonte_serifada,
                      R.string.fonte_mono, R.string.fonte_casual, R.string.fonte_cursiva
              };

              static final int[] ROTATIONS = {0, 90, 180, 270};
              static final int DEFAULT_ROTATION = 90;

              // 10 cores prontas (RGB, sem transparência)
              static final int[] COLORS = {
                      0xFFFFFF, 0xB0BEC5, 0xFFEB3B, 0xFF9800, 0xF44336,
                      0xF06292, 0xBA68C8, 0x42A5F5, 0x26C6DA, 0x66BB6A
              };
              static final int[] COLOR_NAMES = {
                      R.string.cor_branco, R.string.cor_cinza, R.string.cor_amarelo, R.string.cor_laranja,
                      R.string.cor_vermelho, R.string.cor_rosa, R.string.cor_roxo, R.string.cor_azul,
                      R.string.cor_ciano, R.string.cor_verde
              };
              static final int DEFAULT_COLOR = 0xFFFFFF;

              // Opacidade em porcentagem (100 = totalmente visível)
              static final int MIN_OPACITY = 10;
              static final int DEFAULT_OPACITY = 100;

              /** Posição da fonte na lista; 0 (normal) se a chave for desconhecida. */
              static int fontIndex(String key) {
                  for (int i = 0; i < FONT_KEYS.length; i++) {
                      if (FONT_KEYS[i].equals(key)) return i;
                  }
                  return 0;
              }

              static Typeface typeface(int fontIndex) {
                  return Typeface.create(FONT_FAMILIES[fontIndex], Typeface.NORMAL);
              }

              static int rotationOrDefault(int rotation) {
                  for (int r : ROTATIONS) {
                      if (r == rotation) return r;
                  }
                  return DEFAULT_ROTATION;
              }

              static int clampOpacity(int percent) {
                  return Math.max(MIN_OPACITY, Math.min(100, percent));
              }

              /** Junta cor RGB e opacidade (%) em um único valor ARGB. */
              static int argb(int rgb, int opacityPercent) {
                  int alpha = Math.round(clampOpacity(opacityPercent) * 255f / 100f);
                  return (alpha << 24) | (rgb & 0xFFFFFF);
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/ClockWidgetProvider.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/ClockWidgetProvider.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.Configuration;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.widget.RemoteViews;

          /**
           * Relógio digital com rotação, fonte, cor e opacidade configuráveis.
           *
           * A hora é um TextClock (o sistema atualiza sozinho, sem alarme). A fonte e a rotação
           * vêm do layout escolhido (widget_clock_<fonte>_<rotação>); este código ajusta o tamanho
           * da letra para caber no widget, a cor com opacidade, a posição (offset em pixels)
           * e o que acontece ao tocar. Só roda quando o widget é criado, redimensionado
           * ou quando você salva os ajustes.
           */
          public class ClockWidgetProvider extends AppWidgetProvider {

              // Configurações (valem para todos os widgets)
              static final String PREFS = "clock_prefs";
              static final String KEY_APP = "app_pkg";
              static final String KEY_OFFSET_X = "offset_x";
              static final String KEY_OFFSET_Y = "offset_y";
              static final String KEY_ACTION = "tap_action";   // o que o toque no relógio faz
              static final String KEY_FONT = "font";
              static final String KEY_ROTATION = "rotation";
              static final String KEY_COLOR = "color";
              static final String KEY_OPACITY = "opacity";
              static final String TAP_APP = "app";             // abre o app escolhido
              static final String TAP_NONE = "none";           // não faz nada
              static final String TAP_AWAKE = "awake";         // liga/desliga "tela sempre ligada"

              // ---- Ajustes visuais (mude aqui) ----
              private static final float MARGIN_DP = 4f;       // folga entre o relógio e a borda do widget
              private static final int DEFAULT_W_DP = 70;      // usados se o launcher não informar o tamanho
              private static final int DEFAULT_H_DP = 250;

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      update(context, manager, id);
                  }
              }

              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager manager,
                                                    int appWidgetId, Bundle newOptions) {
                  // O widget foi redimensionado: recalcula o tamanho da letra
                  update(context, manager, appWidgetId);
              }

              /** Atualiza todos os widgets na tela. Devolve quantos são. */
              static int updateAll(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  int[] ids = manager.getAppWidgetIds(new ComponentName(context, ClockWidgetProvider.class));
                  for (int id : ids) {
                      update(context, manager, id);
                  }
                  return ids.length;
              }

              /** Aplica fonte, rotação, tamanho, cor, posição e ação do toque em um widget. */
              static void update(Context context, AppWidgetManager manager, int id) {
                  SharedPreferences prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  int dx = prefs.getInt(KEY_OFFSET_X, 0);
                  int dy = prefs.getInt(KEY_OFFSET_Y, 0);
                  int fontIndex = ClockOptions.fontIndex(prefs.getString(KEY_FONT, ClockOptions.FONT_KEYS[0]));
                  int rotation = ClockOptions.rotationOrDefault(
                          prefs.getInt(KEY_ROTATION, ClockOptions.DEFAULT_ROTATION));
                  int color = ClockOptions.argb(
                          prefs.getInt(KEY_COLOR, ClockOptions.DEFAULT_COLOR),
                          prefs.getInt(KEY_OPACITY, ClockOptions.DEFAULT_OPACITY));

                  // O layout carrega a fonte e a rotação (o widget não aceita trocar isso por código)
                  int layoutId = context.getResources().getIdentifier(
                          "widget_clock_" + ClockOptions.FONT_KEYS[fontIndex] + "_" + rotation,
                          "layout", context.getPackageName());
                  if (layoutId == 0) {
                      layoutId = R.layout.widget_clock_normal_90;
                  }
                  RemoteViews views = new RemoteViews(context.getPackageName(), layoutId);

                  // Tamanho da letra: o maior que cabe, já descontando o espaço do deslocamento
                  views.setTextViewTextSize(R.id.clock, TypedValue.COMPLEX_UNIT_PX,
                          fitTextSize(context, manager, id, dx, dy, ClockOptions.typeface(fontIndex), rotation));

                  views.setTextColor(R.id.clock, color);

                  // Posição: o relógio fica centralizado na área sem padding. Padding de 2*d de um lado
                  // desloca o centro em d pixels (positivo = direita / baixo).
                  views.setViewPadding(R.id.root,
                          Math.max(0, 2 * dx), Math.max(0, 2 * dy),
                          Math.max(0, -2 * dx), Math.max(0, -2 * dy));

                  // Ação do toque
                  String action = prefs.getString(KEY_ACTION, TAP_APP);
                  PendingIntent pending = null;
                  if (TAP_AWAKE.equals(action)) {
                      pending = KeepAwakeService.toggleIntent(context);
                  } else if (!TAP_NONE.equals(action)) {
                      Intent launch = null;
                      String pkg = prefs.getString(KEY_APP, null);
                      if (pkg != null) {
                          launch = context.getPackageManager().getLaunchIntentForPackage(pkg);
                      }
                      if (launch == null) {
                          // Nenhum app escolhido (ou o app foi desinstalado): o toque abre a lista para escolher
                          launch = new Intent(context, ConfigActivity.class);
                          launch.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id);
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      }
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) {
                          flags |= PendingIntent.FLAG_IMMUTABLE;
                      }
                      // requestCode = id mantém um PendingIntent separado para cada widget
                      pending = PendingIntent.getActivity(context, id, launch, flags);
                  }
                  if (pending != null) {
                      views.setOnClickPendingIntent(R.id.root, pending);
                  }

                  manager.updateAppWidget(id, views);
              }

              /**
               * Maior tamanho de letra (em pixels) em que "00:00" cabe no widget, na fonte e rotação
               * escolhidas. Em 90 e 270 graus o comprimento do texto usa a altura do widget e a altura
               * dos dígitos usa a largura; em 0 e 180 é o contrário.
               */
              private static float fitTextSize(Context context, AppWidgetManager manager, int id,
                                               int dx, int dy, Typeface typeface, int rotation) {
                  float density = context.getResources().getDisplayMetrics().density;
                  boolean landscape = context.getResources().getConfiguration().orientation
                          == Configuration.ORIENTATION_LANDSCAPE;

                  // Tamanho atual do widget em dp, informado pelo launcher
                  Bundle options = manager.getAppWidgetOptions(id);
                  int wDp = 0;
                  int hDp = 0;
                  if (options != null) {
                      wDp = options.getInt(landscape
                              ? AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH
                              : AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
                      hDp = options.getInt(landscape
                              ? AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT
                              : AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
                  }
                  if (wDp <= 0 || hDp <= 0) {
                      wDp = DEFAULT_W_DP;
                      hDp = DEFAULT_H_DP;
                  }

                  Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  paint.setTypeface(typeface);
                  final float base = 100f;
                  paint.setTextSize(base);
                  Rect digit = new Rect();
                  paint.getTextBounds("0", 0, 1, digit);
                  float length = paint.measureText("00:00");     // comprimento do texto
                  float thickness = Math.max(1, digit.height()); // altura dos dígitos

                  // Reserva espaço para o deslocamento (nos dois lados, pois o relógio é centralizado),
                  // assim a hora nunca passa da borda do widget
                  float margin = MARGIN_DP * density;
                  float availWidth = Math.max(1f, wDp * density - 2 * margin - 2 * Math.abs(dx));
                  float availHeight = Math.max(1f, hDp * density - 2 * margin - 2 * Math.abs(dy));
                  boolean vertical = rotation == 90 || rotation == 270;
                  float lengthSpace = vertical ? availHeight : availWidth;
                  float thicknessSpace = vertical ? availWidth : availHeight;

                  float scale = Math.min(thicknessSpace / thickness, lengthSpace / Math.max(1f, length));
                  if (scale <= 0f) {
                      scale = 1f;
                  }
                  return base * scale;
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/ConfigActivity.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/ConfigActivity.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.ImageView;
          import android.widget.ListView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          /**
           * Lista os apps instalados para escolher qual abrir ao tocar no relógio.
           * Aparece ao adicionar o widget, ao tocar nele sem app escolhido e na tela de ajustes.
           */
          public class ConfigActivity extends Activity {

              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;

              private static class AppItem {
                  final String pkg;
                  final String label;
                  final Drawable icon;

                  AppItem(String pkg, String label, Drawable icon) {
                      this.pkg = pkg;
                      this.label = label;
                      this.icon = icon;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Bundle extras = getIntent().getExtras();
                  if (extras != null) {
                      appWidgetId = extras.getInt(
                              AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }
                  // Se a pessoa sair sem escolher, o Android cancela a adição do widget
                  setResult(RESULT_CANCELED,
                          new Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId));

                  setTitle(R.string.escolha_app);

                  PackageManager pm = getPackageManager();
                  Intent main = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> found = pm.queryIntentActivities(main, 0);

                  final List<AppItem> items = new ArrayList<AppItem>();
                  for (ResolveInfo info : found) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(getPackageName())) continue;
                      items.add(new AppItem(pkg, info.loadLabel(pm).toString(), info.loadIcon(pm)));
                  }
                  Collections.sort(items, new Comparator<AppItem>() {
                      @Override
                      public int compare(AppItem a, AppItem b) {
                          return String.CASE_INSENSITIVE_ORDER.compare(a.label, b.label);
                      }
                  });

                  ListView list = new ListView(this);
                  list.setAdapter(new AppAdapter(items));
                  list.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      @Override
                      public void onItemClick(AdapterView<?> parent, View view, int position, long id) {
                          choose(items.get(position));
                      }
                  });
                  setContentView(list);
              }

              private void choose(AppItem item) {
                  getSharedPreferences(ClockWidgetProvider.PREFS, Context.MODE_PRIVATE)
                          .edit()
                          .putString(ClockWidgetProvider.KEY_APP, item.pkg)
                          .putString(ClockWidgetProvider.KEY_ACTION, ClockWidgetProvider.TAP_APP)
                          .apply();

                  // Com tela de configuração, o próprio app precisa desenhar o widget novo pela primeira vez
                  if (appWidgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                      ClockWidgetProvider.update(this, AppWidgetManager.getInstance(this), appWidgetId);
                  }
                  ClockWidgetProvider.updateAll(this);

                  setResult(RESULT_OK,
                          new Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId));
                  finish();
              }

              private class AppAdapter extends ArrayAdapter<AppItem> {
                  AppAdapter(List<AppItem> items) {
                      super(ConfigActivity.this, 0, items);
                  }

                  @Override
                  public View getView(int position, View convertView, ViewGroup parent) {
                      View row = convertView;
                      if (row == null) {
                          row = getLayoutInflater().inflate(R.layout.item_app, parent, false);
                      }
                      AppItem item = getItem(position);
                      ((TextView) row.findViewById(R.id.label)).setText(item.label);
                      ((ImageView) row.findViewById(R.id.icon)).setImageDrawable(item.icon);
                      return row;
                  }
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/KeepAwakeService.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/KeepAwakeService.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          /**
           * Mantém a tela ligada enquanto estiver ativo. Cada toque no relógio (ou na notificação)
           * liga ou desliga. A notificação fixa mostra o ícone na barra de status.
           */
          public class KeepAwakeService extends Service {

              private static final String ACTION_TOGGLE = "com.exemplo.relogiowidget.TOGGLE_AWAKE";
              private static final String CHANNEL_ID = "tela_ligada";
              private static final int NOTIFICATION_ID = 1;

              private static volatile boolean running = false;

              private PowerManager.WakeLock wakeLock;

              static boolean isRunning() {
                  return running;
              }

              /** PendingIntent que liga/desliga a tela sempre ligada. */
              static PendingIntent toggleIntent(Context context) {
                  Intent intent = new Intent(context, KeepAwakeService.class);
                  intent.setAction(ACTION_TOGGLE);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) {
                      flags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  if (Build.VERSION.SDK_INT >= 26) {
                      return PendingIntent.getForegroundService(context, 0, intent, flags);
                  }
                  return PendingIntent.getService(context, 0, intent, flags);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  // Exigido pelo Android 8+ quando o serviço é iniciado em primeiro plano
                  startForeground(NOTIFICATION_ID, buildNotification());

                  if (running) {
                      turnOff();
                  } else {
                      turnOn();
                  }
                  return START_NOT_STICKY;
              }

              private void turnOn() {
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK, "relogiowidget:tela");
                  wakeLock.setReferenceCounted(false);
                  wakeLock.acquire();
                  running = true;
              }

              private void turnOff() {
                  releaseLock();
                  running = false;
                  stopForeground(true);
                  stopSelf();
              }

              private void releaseLock() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  wakeLock = null;
              }

              @Override
              public void onDestroy() {
                  releaseLock();
                  running = false;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private Notification buildNotification() {
                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm =
                              (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel(
                              CHANNEL_ID, getString(R.string.tela_ligada), NotificationManager.IMPORTANCE_LOW));
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                      builder.setPriority(Notification.PRIORITY_LOW);
                  }
                  builder.setSmallIcon(R.drawable.ic_stat_awake)
                          .setContentTitle(getString(R.string.tela_ligada))
                          .setContentText(getString(R.string.toque_para_desligar))
                          .setOngoing(true)
                          .setContentIntent(toggleIntent(this));   // tocar na notificação desliga
                  return builder.build();
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/SettingsActivity.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/SettingsActivity.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.util.TypedValue;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;

          /**
           * Tela do ícone do app: o que o toque faz, qual app abrir, rotação, fonte, cor,
           * opacidade e posição do relógio. A faixa escura no topo mostra uma prévia.
           */
          public class SettingsActivity extends Activity {

              private static final int REQ_PICK = 1;
              private static final int LIMIT = 5000;   // limite de segurança do deslocamento

              private TextView preview;
              private RadioGroup tapGroup;
              private RadioGroup rotationGroup;
              private RadioGroup fontGroup;
              private Button appButton;
              private Button customButton;
              private EditText offsetX;
              private EditText offsetY;
              private EditText hexField;
              private EditText opacityField;
              private SeekBar opacitySeek;

              private final View[] swatches = new View[ClockOptions.COLORS.length];
              private final int[] fontButtonIds = new int[ClockOptions.FONT_KEYS.length];
              private int selectedRgb = ClockOptions.DEFAULT_COLOR;
              private boolean customSelected = false;
              private boolean updatingOpacity = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_settings);

                  preview = (TextView) findViewById(R.id.preview);
                  tapGroup = (RadioGroup) findViewById(R.id.tap_group);
                  rotationGroup = (RadioGroup) findViewById(R.id.rotation_group);
                  fontGroup = (RadioGroup) findViewById(R.id.font_group);
                  appButton = (Button) findViewById(R.id.btn_app);
                  customButton = (Button) findViewById(R.id.btn_custom);
                  offsetX = (EditText) findViewById(R.id.offset_x);
                  offsetY = (EditText) findViewById(R.id.offset_y);
                  hexField = (EditText) findViewById(R.id.hex_field);
                  opacityField = (EditText) findViewById(R.id.opacity_field);
                  opacitySeek = (SeekBar) findViewById(R.id.opacity_seek);

                  SharedPreferences prefs = prefs();
                  offsetX.setText(String.valueOf(prefs.getInt(ClockWidgetProvider.KEY_OFFSET_X, 0)));
                  offsetY.setText(String.valueOf(prefs.getInt(ClockWidgetProvider.KEY_OFFSET_Y, 0)));
                  showCurrentAction();
                  showCurrentApp();
                  showCurrentRotation(prefs.getInt(ClockWidgetProvider.KEY_ROTATION, ClockOptions.DEFAULT_ROTATION));
                  buildFonts(prefs.getString(ClockWidgetProvider.KEY_FONT, ClockOptions.FONT_KEYS[0]));
                  buildColors(prefs.getInt(ClockWidgetProvider.KEY_COLOR, ClockOptions.DEFAULT_COLOR));
                  setupOpacity(prefs.getInt(ClockWidgetProvider.KEY_OPACITY, ClockOptions.DEFAULT_OPACITY));
                  updatePreview();

                  appButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          startActivityForResult(
                                  new Intent(SettingsActivity.this, ConfigActivity.class), REQ_PICK);
                      }
                  });

                  findViewById(R.id.btn_save).setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          save();
                      }
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_PICK) {
                      // Escolher um app já salva e marca "Abrir um app"
                      showCurrentAction();
                      showCurrentApp();
                  }
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences(ClockWidgetProvider.PREFS, Context.MODE_PRIVATE);
              }

              private int dp(float value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }

              // ---------------- Toque e app ----------------

              private void showCurrentAction() {
                  String action = prefs().getString(ClockWidgetProvider.KEY_ACTION, ClockWidgetProvider.TAP_APP);
                  if (ClockWidgetProvider.TAP_NONE.equals(action)) {
                      tapGroup.check(R.id.rb_none);
                  } else if (ClockWidgetProvider.TAP_AWAKE.equals(action)) {
                      tapGroup.check(R.id.rb_awake);
                  } else {
                      tapGroup.check(R.id.rb_app);
                  }
              }

              private void showCurrentApp() {
                  String pkg = prefs().getString(ClockWidgetProvider.KEY_APP, null);
                  CharSequence label = null;
                  if (pkg != null) {
                      PackageManager pm = getPackageManager();
                      try {
                          label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0));
                      } catch (PackageManager.NameNotFoundException e) {
                          label = null;
                      }
                  }
                  appButton.setText(label != null ? label : getString(R.string.escolher_app));
              }

              // ---------------- Rotação ----------------

              private void showCurrentRotation(int saved) {
                  int rotation = ClockOptions.rotationOrDefault(saved);
                  if (rotation == 0) {
                      rotationGroup.check(R.id.rb_rot_0);
                  } else if (rotation == 180) {
                      rotationGroup.check(R.id.rb_rot_180);
                  } else if (rotation == 270) {
                      rotationGroup.check(R.id.rb_rot_270);
                  } else {
                      rotationGroup.check(R.id.rb_rot_90);
                  }
              }

              private int selectedRotation() {
                  int checked = rotationGroup.getCheckedRadioButtonId();
                  if (checked == R.id.rb_rot_0) return 0;
                  if (checked == R.id.rb_rot_180) return 180;
                  if (checked == R.id.rb_rot_270) return 270;
                  return 90;
              }

              // ---------------- Fonte ----------------

              private void buildFonts(String savedKey) {
                  int selected = ClockOptions.fontIndex(savedKey);
                  for (int i = 0; i < ClockOptions.FONT_KEYS.length; i++) {
                      RadioButton button = new RadioButton(this);
                      button.setId(View.generateViewId());
                      fontButtonIds[i] = button.getId();
                      // Cada item aparece escrito na própria fonte, como prévia
                      button.setText(getString(ClockOptions.FONT_LABELS[i]) + "   12:34");
                      button.setTypeface(ClockOptions.typeface(i));
                      button.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20);
                      fontGroup.addView(button, new RadioGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  }
                  fontGroup.check(fontButtonIds[selected]);
                  fontGroup.setOnCheckedChangeListener(new RadioGroup.OnCheckedChangeListener() {
                      @Override
                      public void onCheckedChanged(RadioGroup group, int checkedId) {
                          updatePreview();
                      }
                  });
              }

              private int selectedFontIndex() {
                  int checked = fontGroup.getCheckedRadioButtonId();
                  for (int i = 0; i < fontButtonIds.length; i++) {
                      if (fontButtonIds[i] == checked) return i;
                  }
                  return 0;
              }

              // ---------------- Cor ----------------

              private void buildColors(int savedRgb) {
                  LinearLayout row1 = (LinearLayout) findViewById(R.id.color_row1);
                  LinearLayout row2 = (LinearLayout) findViewById(R.id.color_row2);
                  for (int i = 0; i < ClockOptions.COLORS.length; i++) {
                      View swatch = new View(this);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(44), 1f);
                      lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                      swatch.setLayoutParams(lp);
                      swatch.setContentDescription(getString(ClockOptions.COLOR_NAMES[i]));
                      final int index = i;
                      swatch.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              selectedRgb = ClockOptions.COLORS[index];
                              customSelected = false;
                              refreshColorSelection();
                              updatePreview();
                          }
                      });
                      (i < 5 ? row1 : row2).addView(swatch);
                      swatches[i] = swatch;
                  }

                  selectedRgb = savedRgb & 0xFFFFFF;
                  customSelected = presetIndex(selectedRgb) < 0;
                  if (customSelected) {
                      hexField.setText(toHex(selectedRgb));
                  }

                  customButton.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          customSelected = true;
                          int typed = parseHex(hexField.getText().toString());
                          if (typed < 0) {
                              hexField.setText(toHex(selectedRgb));
                          } else {
                              selectedRgb = typed;
                          }
                          refreshColorSelection();
                          updatePreview();
                      }
                  });
                  hexField.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {
                      }

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                      }

                      @Override
                      public void afterTextChanged(Editable s) {
                          if (!customSelected) return;
                          int typed = parseHex(s.toString());
                          if (typed >= 0) {
                              selectedRgb = typed;
                              updatePreview();
                          }
                      }
                  });
                  refreshColorSelection();
              }

              /** Destaca o quadradinho escolhido e mostra o campo HEX só em "Personalizar". */
              private void refreshColorSelection() {
                  int selectedPreset = customSelected ? -1 : presetIndex(selectedRgb);
                  for (int i = 0; i < swatches.length; i++) {
                      GradientDrawable shape = new GradientDrawable();
                      shape.setColor(0xFF000000 | ClockOptions.COLORS[i]);
                      shape.setCornerRadius(dp(8));
                      if (i == selectedPreset) {
                          shape.setStroke(dp(3), 0xFF000000);
                      } else {
                          shape.setStroke(dp(1), 0xFF9E9E9E);
                      }
                      swatches[i].setBackground(shape);
                  }
                  String label = getString(R.string.personalizar);
                  customButton.setText(customSelected ? "✓ " + label : label);
                  hexField.setVisibility(customSelected ? View.VISIBLE : View.GONE);
              }

              private static int presetIndex(int rgb) {
                  for (int i = 0; i < ClockOptions.COLORS.length; i++) {
                      if (ClockOptions.COLORS[i] == (rgb & 0xFFFFFF)) return i;
                  }
                  return -1;
              }

              private static String toHex(int rgb) {
                  return String.format(Locale.US, "#%06X", rgb & 0xFFFFFF);
              }

              /** Lê "#RRGGBB" ou "RRGGBB". Devolve -1 se não for um código de 6 dígitos válido. */
              private static int parseHex(String text) {
                  String s = text.trim();
                  if (s.startsWith("#")) {
                      s = s.substring(1);
                  }
                  if (!s.matches("[0-9a-fA-F]{6}")) {
                      return -1;
                  }
                  return Integer.parseInt(s, 16);
              }

              // ---------------- Opacidade ----------------

              private void setupOpacity(int saved) {
                  opacitySeek.setMax(100 - ClockOptions.MIN_OPACITY);
                  setOpacity(ClockOptions.clampOpacity(saved));

                  opacitySeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (!fromUser) return;
                          updatingOpacity = true;
                          opacityField.setText(String.valueOf(progress + ClockOptions.MIN_OPACITY));
                          updatingOpacity = false;
                          updatePreview();
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar seekBar) {
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar seekBar) {
                      }
                  });
                  opacityField.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {
                      }

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                      }

                      @Override
                      public void afterTextChanged(Editable s) {
                          if (updatingOpacity) return;
                          // Não reescreve o campo enquanto a pessoa digita; só move o controle e a prévia
                          opacitySeek.setProgress(currentOpacity() - ClockOptions.MIN_OPACITY);
                          updatePreview();
                      }
                  });
              }

              private void setOpacity(int percent) {
                  updatingOpacity = true;
                  opacitySeek.setProgress(percent - ClockOptions.MIN_OPACITY);
                  opacityField.setText(String.valueOf(percent));
                  updatingOpacity = false;
              }

              /** Opacidade atual (10 a 100). Campo vazio ou inválido usa o valor do controle. */
              private int currentOpacity() {
                  try {
                      return ClockOptions.clampOpacity(Integer.parseInt(opacityField.getText().toString().trim()));
                  } catch (NumberFormatException e) {
                      return opacitySeek.getProgress() + ClockOptions.MIN_OPACITY;
                  }
              }

              // ---------------- Prévia e salvar ----------------

              private void updatePreview() {
                  preview.setTypeface(ClockOptions.typeface(selectedFontIndex()));
                  preview.setTextColor(ClockOptions.argb(selectedRgb, currentOpacity()));
              }

              private void save() {
                  // Valida o HEX antes de salvar qualquer coisa
                  int rgb = selectedRgb;
                  if (customSelected) {
                      int typed = parseHex(hexField.getText().toString());
                      if (typed < 0) {
                          Toast.makeText(this, R.string.hex_invalido, Toast.LENGTH_LONG).show();
                          return;
                      }
                      rgb = typed;
                  }

                  String action;
                  int checked = tapGroup.getCheckedRadioButtonId();
                  if (checked == R.id.rb_none) {
                      action = ClockWidgetProvider.TAP_NONE;
                  } else if (checked == R.id.rb_awake) {
                      action = ClockWidgetProvider.TAP_AWAKE;
                  } else {
                      action = ClockWidgetProvider.TAP_APP;
                  }
                  int opacity = currentOpacity();

                  prefs().edit()
                          .putString(ClockWidgetProvider.KEY_ACTION, action)
                          .putInt(ClockWidgetProvider.KEY_OFFSET_X, parse(offsetX))
                          .putInt(ClockWidgetProvider.KEY_OFFSET_Y, parse(offsetY))
                          .putInt(ClockWidgetProvider.KEY_ROTATION, selectedRotation())
                          .putString(ClockWidgetProvider.KEY_FONT, ClockOptions.FONT_KEYS[selectedFontIndex()])
                          .putInt(ClockWidgetProvider.KEY_COLOR, rgb)
                          .putInt(ClockWidgetProvider.KEY_OPACITY, opacity)
                          .apply();

                  // Saiu do modo "tela ligada": desliga a trava para não ficar presa sem como desligar
                  if (!ClockWidgetProvider.TAP_AWAKE.equals(action) && KeepAwakeService.isRunning()) {
                      stopService(new Intent(this, KeepAwakeService.class));
                  }

                  setOpacity(opacity);   // mostra o valor já ajustado aos limites
                  ClockWidgetProvider.updateAll(this);
                  Toast.makeText(this, R.string.salvo, Toast.LENGTH_SHORT).show();
              }

              /** Lê um número inteiro (aceita negativo). Vazio ou inválido vira 0. */
              private static int parse(EditText field) {
                  String s = field.getText().toString().trim();
                  try {
                      int value = Integer.parseInt(s);
                      return Math.max(-LIMIT, Math.min(LIMIT, value));
                  } catch (NumberFormatException e) {
                      return 0;
                  }
              }
          }
          EOF_ARQUIVO
