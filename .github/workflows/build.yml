name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Compilar
        run: gradle assembleDebug

      - name: Nomear o APK com a versão
        run: |
          VERSAO=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk "saida/relógio_90_${VERSAO}.apk"
          echo "VERSAO=${VERSAO}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: relógio_90_${{ env.VERSAO }}
          path: saida/relógio_90_${{ env.VERSAO }}.apk
