          mkdir -p "$(dirname 'app/src/main/res/xml/clock_widget_info.xml')"
          cat > 'app/src/main/res/xml/clock_widget_info.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:configure="com.exemplo.relogiowidget.ConfigActivity"
              android:initialLayout="@layout/widget_clock_normal_90"
              android:minHeight="180dp"
              android:minResizeHeight="110dp"
              android:minResizeWidth="40dp"
              android:minWidth="70dp"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF_ARQUIVO
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_ARQUIVO'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_ARQUIVO
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_ARQUIVO'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RelogioWidget"
          include ':app'
          EOF_ARQUIVO

      - name: Gerar os 40 layouts (10 fontes x 4 rotações)
        run: |
          mkdir -p app/src/main/res/layout
          for par in "normal:sans-serif" "light:sans-serif-light" "thin:sans-serif-thin" \
                     "medium:sans-serif-medium" "black:sans-serif-black" \
                     "condensed:sans-serif-condensed" "serif:serif" "mono:monospace" \
                     "casual:casual" "cursive:cursive"; do
            key="${par%%:*}"
            fam="${par#*:}"
            for rot in 0 90 180 270; do
              cat > "app/src/main/res/layout/widget_clock_${key}_${rot}.xml" <<EOF_LAYOUT
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <TextClock
                  android:id="@+id/clock"
                  android:layout_width="1000dp"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:fontFamily="${fam}"
                  android:format12Hour="hh:mm"
                  android:format24Hour="HH:mm"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:rotation="${rot}"
                  android:singleLine="true"
                  android:textColor="#FFFFFF"
                  android:textSize="48sp" />

          </FrameLayout>
          EOF_LAYOUT
            done
          done

      - name: Criar chave de assinatura
        run: |
          echo '' | base64 -d > app/debug.keystore

      - name: Compilar
        run: gradle assembleDebug

      - name: Nomear o APK com a versão
        run: |
          VERSAO=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk "saida/relógio_90_${VERSAO}.apk"
          echo "VERSAO=${VERSAO}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: relógio_90_${{ env.VERSAO }}
          path: saida/relógio_90_${{ env.VERSAO }}.apk
