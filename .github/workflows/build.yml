          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical">

              <!-- Prévia fixa no topo: mostra fonte, cor e opacidade escolhidas -->
              <TextView
                  android:id="@+id/preview"
                  android:layout_width="match_parent"
                  android:layout_height="72dp"
                  android:background="#263238"
                  android:gravity="center"
                  android:text="12:34"
                  android:textColor="#FFFFFF"
                  android:textSize="40sp" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="16dp">

                      <!-- Toque -->
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_toque"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <RadioGroup
                          android:id="@+id/tap_group"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content">

                          <RadioButton
                              android:id="@+id/rb_app"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/toque_app" />

                          <RadioButton
                              android:id="@+id/rb_none"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/toque_nada" />

                          <RadioButton
                              android:id="@+id/rb_awake"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/toque_tela" />
                      </RadioGroup>

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="12dp"
                          android:text="@string/explicacao_tela"
                          android:textSize="13sp" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_app" />

                      <Button
                          android:id="@+id/btn_app"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="24dp" />

                      <!-- Rotação -->
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_rotacao"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <RadioGroup
                          android:id="@+id/rotation_group"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="24dp">

                          <RadioButton
                              android:id="@+id/rb_rot_0"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/rot_0" />

                          <RadioButton
                              android:id="@+id/rb_rot_90"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/rot_90" />

                          <RadioButton
                              android:id="@+id/rb_rot_180"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/rot_180" />

                          <RadioButton
                              android:id="@+id/rb_rot_270"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="@string/rot_270" />
                      </RadioGroup>

                      <!-- Fonte (os itens são criados pelo código, cada um na sua fonte) -->
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_fonte"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <RadioGroup
                          android:id="@+id/font_group"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="24dp" />

                      <!-- Cor (os quadradinhos são criados pelo código) -->
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_cor"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:id="@+id/color_row1"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal" />

                      <LinearLayout
                          android:id="@+id/color_row2"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="24dp"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btn_custom"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content" />

                          <EditText
                              android:id="@+id/hex_field"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:hint="@string/dica_hex"
                              android:inputType="textCapCharacters|textNoSuggestions"
                              android:maxLength="7"
                              android:singleLine="true"
                              android:visibility="gone" />
                      </LinearLayout>

                      <!-- Opacidade -->
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_opacidade"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="24dp"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <SeekBar
                              android:id="@+id/opacity_seek"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1" />

                          <EditText
                              android:id="@+id/opacity_field"
                              android:layout_width="64dp"
                              android:layout_height="wrap_content"
                              android:gravity="end"
                              android:inputType="number"
                              android:maxLength="3"
                              android:singleLine="true" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="%"
                              android:textSize="16sp" />
                      </LinearLayout>

                      <!-- Posição -->
                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="@string/rotulo_posicao"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="8dp"
                          android:text="@string/explicacao_posicao"
                          android:textSize="13sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="@string/horizontal" />

                          <EditText
                              android:id="@+id/offset_x"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="end"
                              android:inputType="numberSigned"
                              android:maxLength="6" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="@string/vertical" />

                          <EditText
                              android:id="@+id/offset_y"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:gravity="end"
                              android:inputType="numberSigned"
                              android:maxLength="6" />
                      </LinearLayout>

                      <Button
                          android:id="@+id/btn_save"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:text="@string/salvar" />

                  </LinearLayout>
              </ScrollView>
          </LinearLayout>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/res/layout/item_app.xml')"
          cat > 'app/src/main/res/layout/item_app.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:padding="12dp">

              <ImageView
                  android:id="@+id/icon"
                  android:layout_width="40dp"
                  android:layout_height="40dp"
                  android:contentDescription="@null" />

              <TextView
                  android:id="@+id/label"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginLeft="16dp"
                  android:layout_marginStart="16dp"
                  android:singleLine="true"
                  android:textSize="16sp" />

          </LinearLayout>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
