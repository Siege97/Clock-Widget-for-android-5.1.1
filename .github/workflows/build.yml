name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Criar os arquivos do projeto
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.exemplo.relogiowidget'
              compileSdk 34

              // Chave de assinatura fixa: assim cada APK novo instala por cima do anterior
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'chave'
                      keyPassword 'android'
                  }
              }

              defaultConfig {
                  applicationId "com.exemplo.relogiowidget"
                  minSdk 22          // Android 5.1.1
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Permite listar os apps instalados na tela de escolha (Android 11+) -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name">

                  <!-- Tela que aparece ao adicionar o widget: escolher qual app abrir ao tocar -->
                  <activity
                      android:name=".ConfigActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.Light.Dialog">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ClockWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/clock_widget_info" />
                  </receiver>

              </application>

          </manifest>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/ClockWidgetProvider.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/ClockWidgetProvider.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.text.format.DateFormat;
          import android.widget.RemoteViews;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          /**
           * Relógio digital girado 90 graus para a direita.
           *
           * Widgets não podem girar views no Android 5.1, então a hora é desenhada
           * já girada dentro de um Bitmap, que é trocado a cada minuto por um alarme.
           */
          public class ClockWidgetProvider extends AppWidgetProvider {

              static final String PREFS = "clock_prefs";
              static final String KEY_APP = "app_";
              private static final String ACTION_TICK = "com.exemplo.relogiowidget.TICK";

              // ---- Ajustes visuais (mude aqui) ----
              private static final int TEXT_COLOR = Color.WHITE;
              private static final float TEXT_SIZE_PX = 280f;   // só define a nitidez; o widget se ajusta ao tamanho que você der
              private static final int PADDING_PX = 12;

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      update(context, manager, id);
                  }
                  scheduleNextTick(context);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  String action = intent.getAction();
                  if (ACTION_TICK.equals(action)
                          || Intent.ACTION_TIME_CHANGED.equals(action)
                          || Intent.ACTION_TIMEZONE_CHANGED.equals(action)) {
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      int[] ids = manager.getAppWidgetIds(new ComponentName(context, ClockWidgetProvider.class));
                      for (int id : ids) {
                          update(context, manager, id);
                      }
                      if (ids.length > 0) {
                          scheduleNextTick(context);
                      }
                  }
              }

              @Override
              public void onEnabled(Context context) {
                  scheduleNextTick(context);
              }

              @Override
              public void onDisabled(Context context) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am != null) {
                      am.cancel(tickIntent(context));
                  }
              }

              @Override
              public void onDeleted(Context context, int[] appWidgetIds) {
                  android.content.SharedPreferences.Editor editor =
                          context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit();
                  for (int id : appWidgetIds) {
                      editor.remove(KEY_APP + id);
                  }
                  editor.apply();
              }

              /** Redesenha um widget: hora girada + toque que abre o app escolhido. */
              static void update(Context context, AppWidgetManager manager, int id) {
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_clock);
                  views.setImageViewBitmap(R.id.clock, renderTime(context));

                  String pkg = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getString(KEY_APP + id, null);
                  if (pkg != null) {
                      Intent launch = context.getPackageManager().getLaunchIntentForPackage(pkg);
                      if (launch != null) {
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= 23) {
                              flags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          // requestCode = id mantém um PendingIntent separado para cada widget
                          PendingIntent pending = PendingIntent.getActivity(context, id, launch, flags);
                          views.setOnClickPendingIntent(R.id.root, pending);
                      }
                  }
                  manager.updateAppWidget(id, views);
              }

              /** Desenha "HH:mm" e já gira 90 graus no sentido horário. */
              private static Bitmap renderTime(Context context) {
                  String pattern = DateFormat.is24HourFormat(context) ? "HH:mm" : "hh:mm";
                  String text = new SimpleDateFormat(pattern, Locale.US).format(new Date());

                  Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  paint.setColor(TEXT_COLOR);
                  paint.setTextSize(TEXT_SIZE_PX);
                  paint.setTypeface(Typeface.DEFAULT);

                  // Tamanho fixo (medido com "00:00") para o relógio não "pular" de tamanho a cada minuto
                  float refWidth = paint.measureText("00:00");
                  Rect digit = new Rect();
                  paint.getTextBounds("0", 0, 1, digit);

                  int w = (int) Math.ceil(refWidth) + 2 * PADDING_PX;   // largura da hora na horizontal
                  int h = digit.height() + 2 * PADDING_PX;              // altura da hora na horizontal

                  Bitmap bitmap = Bitmap.createBitmap(h, w, Bitmap.Config.ARGB_8888);   // já girado: largura = h, altura = w
                  Canvas canvas = new Canvas(bitmap);
                  canvas.translate(h, 0);
                  canvas.rotate(90);

                  float x = PADDING_PX + (refWidth - paint.measureText(text)) / 2f;
                  float y = PADDING_PX - digit.top;
                  canvas.drawText(text, x, y, paint);
                  return bitmap;
              }

              // ---- Alarme que dispara na virada de cada minuto ----

              private static PendingIntent tickIntent(Context context) {
                  Intent intent = new Intent(context, ClockWidgetProvider.class);
                  intent.setAction(ACTION_TICK);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) {
                      flags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  return PendingIntent.getBroadcast(context, 0, intent, flags);
              }

              static void scheduleNextTick(Context context) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;

                  long next = (System.currentTimeMillis() / 60000L + 1) * 60000L + 300L;
                  PendingIntent pending = tickIntent(context);
                  try {
                      if (Build.VERSION.SDK_INT >= 23) {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC, next, pending);
                      } else {
                          am.setExact(AlarmManager.RTC, next, pending);
                      }
                  } catch (SecurityException e) {
                      // Android 12+ sem permissão de alarme exato: usa alarme aproximado
                      am.set(AlarmManager.RTC, next, pending);
                  }
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/java/com/exemplo/relogiowidget/ConfigActivity.java')"
          cat > 'app/src/main/java/com/exemplo/relogiowidget/ConfigActivity.java' <<'EOF_ARQUIVO'
          package com.exemplo.relogiowidget;

          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.ImageView;
          import android.widget.ListView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          /** Aparece ao adicionar o widget: lista os apps instalados para escolher qual abrir ao tocar. */
          public class ConfigActivity extends Activity {

              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;

              private static class AppItem {
                  final String pkg;       // null = não abrir nada
                  final String label;
                  final Drawable icon;

                  AppItem(String pkg, String label, Drawable icon) {
                      this.pkg = pkg;
                      this.label = label;
                      this.icon = icon;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Bundle extras = getIntent().getExtras();
                  if (extras != null) {
                      appWidgetId = extras.getInt(
                              AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }
                  // Se a pessoa sair sem escolher, o Android cancela a adição do widget
                  setResult(RESULT_CANCELED,
                          new Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId));
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }

                  setTitle(R.string.escolha_app);

                  PackageManager pm = getPackageManager();
                  Intent main = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> found = pm.queryIntentActivities(main, 0);

                  final List<AppItem> apps = new ArrayList<AppItem>();
                  for (ResolveInfo info : found) {
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(getPackageName())) continue;
                      apps.add(new AppItem(pkg, info.loadLabel(pm).toString(), info.loadIcon(pm)));
                  }
                  Collections.sort(apps, new Comparator<AppItem>() {
                      @Override
                      public int compare(AppItem a, AppItem b) {
                          return String.CASE_INSENSITIVE_ORDER.compare(a.label, b.label);
                      }
                  });

                  final List<AppItem> items = new ArrayList<AppItem>();
                  items.add(new AppItem(null, getString(R.string.nenhum), null));
                  items.addAll(apps);

                  ListView list = new ListView(this);
                  list.setAdapter(new AppAdapter(items));
                  list.setOnItemClickListener(new AdapterView.OnItemClickListener() {
                      @Override
                      public void onItemClick(AdapterView<?> parent, View view, int position, long id) {
                          choose(items.get(position));
                      }
                  });
                  setContentView(list);
              }

              private void choose(AppItem item) {
                  SharedPreferences.Editor editor =
                          getSharedPreferences(ClockWidgetProvider.PREFS, Context.MODE_PRIVATE).edit();
                  if (item.pkg == null) {
                      editor.remove(ClockWidgetProvider.KEY_APP + appWidgetId);
                  } else {
                      editor.putString(ClockWidgetProvider.KEY_APP + appWidgetId, item.pkg);
                  }
                  editor.apply();

                  // Com tela de configuração, o próprio app precisa desenhar o widget pela primeira vez
                  ClockWidgetProvider.update(this, AppWidgetManager.getInstance(this), appWidgetId);
                  ClockWidgetProvider.scheduleNextTick(this);

                  setResult(RESULT_OK,
                          new Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId));
                  finish();
              }

              private class AppAdapter extends ArrayAdapter<AppItem> {
                  AppAdapter(List<AppItem> items) {
                      super(ConfigActivity.this, 0, items);
                  }

                  @Override
                  public View getView(int position, View convertView, ViewGroup parent) {
                      View row = convertView;
                      if (row == null) {
                          row = getLayoutInflater().inflate(R.layout.item_app, parent, false);
                      }
                      AppItem item = getItem(position);
                      ((TextView) row.findViewById(R.id.label)).setText(item.label);
                      ((ImageView) row.findViewById(R.id.icon)).setImageDrawable(item.icon);
                      return row;
                  }
              }
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/res/layout/item_app.xml')"
          cat > 'app/src/main/res/layout/item_app.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:padding="12dp">

              <ImageView
                  android:id="@+id/icon"
                  android:layout_width="40dp"
                  android:layout_height="40dp"
                  android:contentDescription="@null" />

              <TextView
                  android:id="@+id/label"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginLeft="16dp"
                  android:layout_marginStart="16dp"
                  android:singleLine="true"
                  android:textSize="16sp" />

          </LinearLayout>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/res/layout/widget_clock.xml')"
          cat > 'app/src/main/res/layout/widget_clock.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <ImageView
                  android:id="@+id/clock"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:contentDescription="@string/widget_name"
                  android:scaleType="fitCenter" />

          </FrameLayout>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Relógio Widget</string>
              <string name="widget_name">Relógio digital</string>
              <string name="escolha_app">Abrir ao tocar:</string>
              <string name="nenhum">Nenhum (não abrir nada)</string>
          </resources>
          EOF_ARQUIVO
          mkdir -p "$(dirname 'app/src/main/res/xml/clock_widget_info.xml')"
          cat > 'app/src/main/res/xml/clock_widget_info.xml' <<'EOF_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:configure="com.exemplo.relogiowidget.ConfigActivity"
              android:initialLayout="@layout/widget_clock"
              android:minHeight="180dp"
              android:minResizeHeight="110dp"
              android:minResizeWidth="40dp"
              android:minWidth="70dp"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF_ARQUIVO
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_ARQUIVO'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_ARQUIVO
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_ARQUIVO'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_ARQUIVO
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_ARQUIVO'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RelogioWidget"
          include ':app'
          EOF_ARQUIVO

      - name: Criar chave de assinatura
        run: |
          echo '' | base64 -d > app/debug.keystore

      - name: Compilar
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RelogioWidget-apk
          path: app/build/outputs/apk/debug/app-debug.apk
